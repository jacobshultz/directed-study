---
- name: Discover protected nodes
  hosts: controller
  gather_facts: true

  tasks:
    - name: Lookup leases
      ansible.builtin.command:
        cmd: awk '{ print $3 }' /var/lib/misc/dnsmasq.leases
      register: leases

    - name: Add leases to voliatile inventory
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: p_nodes
        ansible_user: op
          
      loop: "{{ leases.stdout_lines }}"
      
    - name: Print p nodes group
      ansible.builtin.debug:
        msg: "P nodes: {{ groups['p_nodes'] }}"

- name: Capture images from each camera
  hosts: controller, p_nodes
  gather_facts: false

  vars:
    remote_dir: "/home/op/Cluster"
    local_dir: "../cluster_captures"

  tasks:
    - name: Capture on controller
      ansible.builtin.script: ../scripts/capture.py
      when: inventory_hostname == 'controller'

    - name: Capture on each p node
      when: "'p_nodes' in group_names"
      ansible.builtin.command:
        cmd: ssh op@{{ item }} python3 - {{ item }}
        stdin: "{{ lookup('file', '../scripts/capture.py') }}"
      loop: "{{ hostvars['controller']['leases'].stdout_lines }}"
      delegate_to: controller

    - name: Copy p node images to controller
      ansible.builtin.command:
        cmd: scp op@{{ item }}:{{ remote_dir }}/*.jpg {{ remote_dir }}/
      when: "'p_nodes' in group_names"
      delegate_to: controller
      loop: "{{ hostvars['controller']['leases'].stdout_lines }}"
      
    - name: Find images on controller # includes p node imges
      ansible.builtin.find:
        paths: "{{ remote_dir }}"
        patterns: "*.jpg"
      register: found_images
      when: inventory_hostname == 'controller'

    - name: Fetch images from controller
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ local_dir }}/"
        flat: yes
      loop: "{{ found_images.files }}"
      when: inventory_hostname == 'controller'
    